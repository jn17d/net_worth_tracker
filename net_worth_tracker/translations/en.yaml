en:
  configuration:
    demo:
      name: Demo mode
      description: >-
        Show realistic fake data instead of real accounts. Turn it off once
        you've added your keys.
    t212_env:
      name: Trading 212 environment
      description: live for real money accounts, demo for practice accounts.
    poll_minutes:
      name: Poll interval (minutes)
      description: How often balances are fetched from Trading 212 and Monzo (1–1440).
    t212_accounts:
      name: Trading 212 accounts
      description: >-
        One entry per Trading 212 account. Create an API key in
        Trading 212 → Settings → API; the key and secret go together.
    monzo_client_id:
      name: Monzo client ID
      description: From a confidential OAuth client at developers.monzo.com. Optional — you can also add it on the add-on's Settings page.
    monzo_client_secret:
      name: Monzo client secret
      description: Optional — you can also add it on the add-on's Settings page.
